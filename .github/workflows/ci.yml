name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for the default GITHUB_TOKEN. No job needs more: nothing is pushed or deployed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that needs no Docker: static checks, unit/component tests, the site/web/api builds.
  check:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The tenant-isolation suite lives in its own job (db-isolation). The jsdom suites (ui, web)
      # time out when every package's tests start at once on a 2-4 core runner, so cap turbo.
      - name: Unit and component tests
        run: pnpm turbo run test --filter='!@remix/db' --concurrency=2

      - name: Build
        run: pnpm build

      - name: Audit dependencies (high+)
        run: pnpm audit --audit-level high

      - name: Upload site build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-out
          path: apps/site/out
          retention-days: 7

  # Database unit tests + the generated tenant-isolation suite against a real Postgres 18.
  # Testcontainers talks to the runner's Docker daemon (preinstalled on ubuntu-latest); the reaper
  # container cleans up after the run, so no extra settings are needed. A separate job runs in
  # parallel with `check`, so the Docker-bound suite does not add to the critical path, and a
  # failure names the isolation suite directly.
  db-isolation:
    name: Tenant isolation (Postgres 18)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Only @remix/db and what it depends on; the web/site toolchains are not needed here.
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --filter '@remix/db...'

      - name: Database unit tests and isolation suite
        run: pnpm --filter @remix/db test

  # Phase 1 walking-skeleton journeys (e2e/): Chromium -> built web app -> built API -> Postgres 18
  # with RLS and the dev seed. Postgres comes from infra/docker/compose.yaml rather than a
  # `services:` container: only compose mounts postgres/init (the four roles and the remix
  # database, which the migrations insist on), and that mount needs the checked-out repo. Only the
  # postgres service is started (no Valkey, Mailpit or S3: nothing here uses them). The tests start
  # the built API and web app themselves (e2e/playwright.config.ts).
  e2e:
    name: E2E journeys (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Start Postgres 18 (roles init script mounted)
        run: docker compose -f infra/docker/compose.yaml up -d --wait --wait-timeout 120 postgres

      - name: Migrate and seed
        run: |
          pnpm db:migrate
          pnpm db:seed

      # The web build bakes the /api/v1 rewrite in at build time; without it the browser has no API.
      - name: Build API and web (with the /api/v1 rewrite)
        run: |
          pnpm --filter @remix/api build
          WEB_API_REWRITE=true pnpm --filter @remix/web build

      - name: Install Chromium
        run: pnpm --filter @remix/e2e exec playwright install --with-deps chromium

      - name: Run the journeys
        run: pnpm e2e
        env:
          # One JSON line per API request in the job log, to diagnose a failure after the fact.
          E2E_API_LOG_LEVEL: info

      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: docker compose -f infra/docker/compose.yaml down -v

  # The production image: it must build, boot, and pass a vulnerability scan.
  api-image:
    name: API image (build · smoke · Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: remix-api:ci
      # Pinned scanner version; Dependabot's docker ecosystem does not track this, bump it with
      # the Trivy releases.
      TRIVY_IMAGE: aquasec/trivy:0.75.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The API refuses to boot without a database it can verify (remix_app must not bypass RLS or
      # own tables), so run Postgres 18 with the real role-init script on a private network.
      # Production config is strict (no localhost base domain, secure cookies, a real trusted
      # proxy list), so give it real-looking hosts and the private ranges Docker networks use.
      # Dev-only role passwords from infra/docker; nothing here is a secret.
      - name: Smoke test (boots against Postgres, answers /health and /health/ready)
        run: |
          docker network create smoke
          docker run -d --name smoke-db --network smoke \
            -e POSTGRES_PASSWORD=ci-only-superuser \
            -v "$PWD/infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro" \
            postgres:18.6-alpine
          # TCP only answers after the init scripts have run and the real server has started.
          for _ in $(seq 1 60); do
            docker exec smoke-db pg_isready -h 127.0.0.1 -U postgres -d remix >/dev/null 2>&1 && break
            sleep 1
          done
          docker run -d --name api-smoke --network smoke -p 127.0.0.1:4000:4000 \
            -e DATABASE_URL=postgres://remix_app:remix_app_dev_password@smoke-db:5432/remix \
            -e TENANT_BASE_DOMAINS=remix.lk -e PLATFORM_HOSTS=admin.remix.lk \
            -e TRUST_PROXY=uniquelocal \
            "$IMAGE"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/health/ready; then
              echo; curl -fsS http://127.0.0.1:4000/health; echo; exit 0
            fi
            sleep 1
          done
          docker logs api-smoke
          exit 1

      # Fails the job on HIGH or CRITICAL findings that have a fix available. Unfixed OS-package
      # CVEs are ignored: nothing can be done about them until the base image is patched.
      # usr/local/lib/node_modules/npm is the base image's own npm (never run by the API; its
      # bundled brace-expansion, tar, undici and ip-address are what Trivy flags). It is skipped
      # until apps/api/Dockerfile deletes npm from the runtime stage; then drop --skip-dirs.
      - name: Trivy scan (HIGH/CRITICAL with a fix)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --skip-dirs usr/local/lib/node_modules/npm \
              --exit-code 1 \
              --no-progress \
              --skip-version-check \
              "$IMAGE"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    container:
      # Pinned to a release and its manifest digest (`latest` moves under us); bump both together.
      image: semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # design/ is exported mockups; graphify-out/ is a generated knowledge graph (JSON/HTML).
      - run: >-
          semgrep scan
          --config p/typescript --config p/react --config p/secrets
          --error
          --exclude design --exclude graphify-out
