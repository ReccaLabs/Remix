version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Colombo
    open-pull-requests-limit: 10
    groups:
      next-react:
        patterns: ['next', 'react', 'react-dom', '@types/react*', 'eslint-config-next', '@next/*']
      tailwind:
        patterns: ['tailwindcss', '@tailwindcss/*', 'prettier-plugin-tailwindcss']
      tooling:
        patterns: ['typescript', 'eslint', 'prettier', 'vitest', 'turbo']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Base image of the API (apps/api/Dockerfile) and the dev stack images (infra/docker).
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /infra/docker
    schedule:
      interval: weekly
