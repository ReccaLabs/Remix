packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'
# Dependency install scripts are denied unless listed true here (supply-chain hardening).
# These ship prebuilt binaries via optional platform packages, so scripts are not needed.
# @remix/db dev tools: esbuild (drizzle-kit, tsx) uses its platform package; ssh2 and its
# optional cpu-features native addon (testcontainers) fall back to pure JS; protobufjs's
# script is only a version notice.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  protobufjs: false
  ssh2: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.4'
  - '@turbo/darwin-arm64@2.11.4'
  - '@turbo/linux-64@2.11.4'
  - '@turbo/linux-arm64@2.11.4'
  - '@turbo/windows-64@2.11.4'
  - '@turbo/windows-arm64@2.11.4'
  - icu-minify@4.14.7
  - lucide-react@1.48.0
  - next-intl-swc-plugin-extractor@4.14.7
  - next-intl@4.14.7
  - turbo@2.11.4
  - use-intl@4.14.7

# Security overrides for vulnerable transitive dependencies (CI runs `pnpm audit --audit-level high`).
# Remove an entry once the parent package ships the fixed version itself.
overrides:
  # GHSA-5j98-mcp5-4vw2: glob CLI command injection, fixed in 10.5.0. Via testcontainers → archiver.
  'glob@>=10.2.0 <10.5.0': ^10.5.0
  # GHSA-67mh-4wv8-2f99: esbuild dev-server request leak, fixed in 0.25.0. Via drizzle-kit → @esbuild-kit.
  'esbuild@<0.25.0': ^0.25.0
  # GHSA-68fv-2mgg-jv7q: source-map-js event-loop DoS, fixed in 1.2.2. Via vitest/vite → postcss, css-tree.
  'source-map-js@<1.2.2': ^1.2.2
  # GHSA-wq5f-xc86-pv6w: sharp's bundled librsvg, fixed in 0.35.5. Via next (image optimisation).
  'sharp@<0.35.5': ^0.35.5

auditConfig:
  ignoreGhsas:
    # braces ≤ 3.0.3 stack-exhaustion DoS on crafted brace patterns; no patched version exists yet.
    # Reached only through build/lint tooling (micromatch) that expands our own static globs, never
    # user input, and it is not in the API image. Re-check when braces publishes a fix.
    - GHSA-vfj7-8cjw-p6xm
